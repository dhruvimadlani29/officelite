<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officelite - Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="signup-body sign-up-page">

    <div class="main-signup-wrapper">

        <section class="signup-content">
            <header class="header-signup">
                <a href="index.html" class="logo-link">
                    <img src="images/logo.svg" alt="Officelite Logo">
                </a>
            </header>

            <div class="marketing-text">
                <h1>Work smarter. Save time.</h1>
                <p>Easily manage your projects. Get on the list and receive in-app perks available only to early
                    subscribers. We are moving into final development and getting ready for official launch soon.</p>
            </div>

        </section>

        <section class="signup-form-section">
            <div class="form-card">
                <form action="index.html" method="GET" class="signup-form">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                    </div>

                    <div class="form-group">
                        <label for="plan">Plan</label>
                        <select id="plan" name="plan" required>
                            <option value="" disabled selected>Select a plan...</option>
                            <option value="basic">Basic (Free)</option>
                            <option value="pro">Pro ($9.99/mo)</option>
                            <option value="ultimate">Ultimate ($19.99/mo)</option>
                        </select>
                    </div>
                    <button type="submit" class="button button-primary">Get on the list</button>
                </form>
            </div>
        </section>

    </div>
</body>

</html>
